[build]
  command = "npm run build"
  publish = "dist"

# Firebase Web API keys are public identifiers by design (access is enforced by Firebase rules), so the
# secrets scanner is told to skip only this key. Scanning stays enabled for all other values.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY"

# Environment variables — set these in the Netlify dashboard under Site Settings > Environment Variables.
# Copy the values from your local .env file:
# VITE_FIREBASE_API_KEY
# VITE_FIREBASE_AUTH_DOMAIN
# VITE_FIREBASE_DATABASE_URL
# VITE_FIREBASE_PROJECT_ID
# VITE_FIREBASE_STORAGE_BUCKET
# VITE_FIREBASE_MESSAGING_SENDER_ID
# VITE_FIREBASE_APP_ID
# VITE_ADMIN_ROUTE

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
